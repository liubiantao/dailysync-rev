name: scheduled
on:
  schedule:
    - cron: "0 0 2 * *"  # 每月1号跑一次
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep alive commit
        run: |
          git config user.email "41898282113+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit --allow-empty -m "chore: scheduled"
          git push
